[workspace]
resolver = "3"
members = [
    "src/hudswitch-core",
    "src/hudswitch-windows",
    "src/terminalhud-core",
    "src/terminalhud-app",
    "src/terminal-adapters/windows-terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TerminalHUD/TerminalHUD"
publish = false

[workspace.dependencies]
hudswitch-core = { path = "src/hudswitch-core" }
hudswitch-windows = { path = "src/hudswitch-windows" }
terminalhud-core = { path = "src/terminalhud-core" }
terminalhud-windows-terminal = { path = "src/terminal-adapters/windows-terminal" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
