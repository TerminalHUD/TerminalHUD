[package]
name = "terminalhud-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
loop-comparison = ["dep:tao"]

[dependencies]
terminalhud-core.workspace = true

[target.'cfg(windows)'.dependencies]
hudswitch-windows.workspace = true
terminalhud-windows-terminal.workspace = true
serde_json = "1.0.145"

windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
tray-icon = { version = "0.26.1", default-features = false }
tao = { version = "0.37.2", default-features = false, optional = true }

[[example]]
name = "shell-loop-probe"
path = "../../tests/terminalhud-tests/app-shell/shell_loop_probe.rs"
required-features = ["loop-comparison"]

[[test]]
name = "shell_ipc"
path = "../../tests/terminalhud-tests/app-shell/ipc/mod.rs"

[[bin]]
name = "terminalhud"
path = "src/main.rs"

[[bin]]
name = "terminalhud-shell"
path = "src/shell_main.rs"

[[example]]
name = "app-slice-proof"
path = "../../tests/terminalhud-tests/app-shell/slice-proof/main.rs"
