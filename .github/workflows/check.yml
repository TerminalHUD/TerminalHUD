name: Repository checks

on:
  pull_request:
  push:
    branches: [main, devel]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check contributor configuration and documentation
        run: python3 scripts/check_repository.py
      - name: Check whitespace in the proposed change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              git diff --check "$BASE_SHA...$HEAD_SHA"
            else
              git diff --check "$BASE_SHA" "$HEAD_SHA"
            fi
          else
            git show --check --oneline "$HEAD_SHA"
          fi

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check workspace architecture
        run: python scripts/check_workspace.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all workspace targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build all workspace targets
        run: cargo build --workspace --all-targets --locked
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Test Windows packaging with temporary files and fake registry
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/tests/packaging.tests.ps1
      - name: Run native toolchain probe
        run: cargo run --locked -p hudswitch-windows --example toolchain-probe

  check:
    if: always()
    needs: [repository, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Require repository and both Rust jobs to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$RUST_RESULT" = success
